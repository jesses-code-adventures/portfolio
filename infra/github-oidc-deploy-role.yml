AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC deploy role for the portfolio static site.

Parameters:
  GitHubOwner:
    Type: String
    Default: jesses-code-adventures
  GitHubRepo:
    Type: String
    Default: portfolio
  GitHubBranch:
    Type: String
    Default: main
  SiteBucketName:
    Type: String
    Default: jessewilliams-dev-site
  CloudFrontDistributionId:
    Type: String
    Default: E2GJLJ99B9WSFB
  GitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::181080507004:oidc-provider/token.actions.githubusercontent.com

Resources:
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-github-actions-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: StaticSiteDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${SiteBucketName}'
              - Sid: WriteSiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${SiteBucketName}/*'
              - Sid: InvalidateCloudFront
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}'

Outputs:
  RoleArn:
    Description: Add this ARN as the AWS_DEPLOY_ROLE_ARN GitHub Actions secret.
    Value: !GetAtt GitHubDeployRole.Arn
